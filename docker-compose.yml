# Worker-only stack (automation-first): the Telegram worker runtime —
# collection, scheduler, queues — with no web surface, so no published port
# and no HTTP healthcheck. The legacy web panel is the separate tg-webui
# package and is not part of this image.
services:
  tg-search:
    build: .
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    env_file: .env
    restart: unless-stopped
