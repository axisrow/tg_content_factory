# Worker-only stack (automation-first): the Telegram worker runtime —
# collection, scheduler, queues — with no web surface (removed in #1868), so no
# published port and no HTTP healthcheck.
services:
  tg-search:
    build: .
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    env_file: .env
    restart: unless-stopped
