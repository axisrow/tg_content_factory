name: CI

# Triggers — CI runs only on `main` and on pull requests (owner decision, #1051).
#   push: [main]   — post-merge verification that main itself stays green.
#   pull_request:  — fires on PR open AND on every push inside an open PR
#                    (the `synchronize` event), so PR commits are still covered.
# Both run the same full test suite; the CI speedup is the parallel job split
# (lint | static-checks | tests-smoke | tests-shards | tests-serial), not test
# selection (#1097 §5), and — on top of that split — sharding the parallel-safe
# suite across a 3-runner matrix so the wall is the slowest shard, not the
# whole suite.
# Dropped the old `fix/**` / `codex/**` push triggers: they double-ran CI (once
# for the branch push, once for the PR) and burned runners on intermediate,
# draft, PR-less pushes. A push to a feature branch with no open PR no longer
# triggers CI — open the PR to get a run.
on:
  push:
    branches:
      - main
  pull_request:
    # Docs-only changes skip the suite (#1051). paths-ignore is "all-or-nothing":
    # the run is skipped only when EVERY changed file matches a pattern below, so
    # a PR touching both code and docs still runs the full CI. The branch-name
    # guard (check-branch-name) still runs because it is an independent job that
    # github evaluates after the path filter at the workflow level — a docs-only
    # PR simply has no test job to run.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "mkdocs.yml"

# Cancel an in-progress run when a newer commit is pushed to the same ref
# (#1051). Without this, every push to an open PR left the previous run burning
# a runner to completion. Grouping by workflow+ref keeps main and each PR
# independent; cancel-in-progress reclaims the runner for the latest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # A trivial github-script job; the timeout is a hang guard, not a budget.
    timeout-minutes: 5
    steps:
      - name: Reject branch names with "+"
        if: contains(github.head_ref, '+')
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⛔ Символ `+` недопустим в названии ветки (`' + context.payload.pull_request.head.ref + '`). Переименуйте ветку без `+` (используйте `-` или `.`).'
            });
            core.setFailed('Branch name contains "+", which is not allowed.');

  # Lint is its own job (#1097 §5) so a style slip reds CI in seconds, in
  # parallel with the slower static-checks and tests jobs — no waiting on pytest
  # to learn ruff is unhappy.
  lint:
    runs-on: ubuntu-latest
    # Just `pip install` + ruff; minutes at most. 10 leaves headroom for a cold
    # pip cache.
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests conftest.py

  # Static gates run as their own job so they fail fast and in parallel with the
  # long tests jobs (#944, #1097 §5). Holds the import-architecture contracts and
  # the blocking complexity gate, plus the advisory security/duplication scans.
  static-checks:
    runs-on: ubuntu-latest
    # Import contracts + complexity gate + security scans + strict docs build.
    # Typically a couple of minutes; 10 leaves headroom over a cold pip install.
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Import architecture contracts
        run: lint-imports --config .importlinter

      # Blocking cyclomatic-complexity gate (#923). After #922/#923 reduced the
      # last rank-F functions, main is at F:0 — this keeps it there: any function
      # that grows back to radon rank F (CC ≥ 41) reds CI. radon/vulture ship in
      # the [dev] extra so `pip install -e ".[dev]"` above already provides them.
      - name: Cyclomatic-complexity gate (no rank-F functions)
        run: python scripts/code_health.py --fail-on F

      # Non-blocking duplication guard (#807 dedup round 2). Current level is
      # ~0.6%; threshold 1% leaves headroom while surfacing regressions. Kept
      # advisory (continue-on-error) so it never reds CI on its own. jscpd is
      # version-pinned so CI never executes an unvetted future npm release
      # (review #918: @claude/@codex supply-chain note).
      - name: Code duplication guard (advisory)
        continue-on-error: true
        run: npx -y jscpd@5.0.10 --min-tokens 70 --format python --threshold 1 src

      # Dependency CVE scan (#1053, #1097 §4). Advisory for now (continue-on-error)
      # so a pre-existing transitive CVE never reds CI — pip-audit LOCATES,
      # Dependabot (.github/dependabot.yml) FIXES via update PRs. Ratchet to
      # blocking later once the current findings are triaged. pip-audit ships in
      # the [dev] extra installed above.
      - name: Dependency vulnerability scan (advisory)
        continue-on-error: true
        run: pip-audit --desc

      # Static security analysis of our own code (#1053). Advisory like the
      # duplication guard: the codebase has ~hundreds of broad `except Exception`
      # blocks that bandit flags (B110/B112) — kept non-blocking to avoid noise
      # until a baseline/skip-list is curated. Config lives in [tool.bandit] in
      # pyproject.toml (recurses src, excludes tests).
      - name: Code security scan (advisory)
        continue-on-error: true
        run: bandit -c pyproject.toml -r src -q

      # Doc-coverage (interrogate) is intentionally NOT a CI step (#1097 §3): it
      # stays a LOCAL script (scripts/doc_coverage.py, #1072) the owner runs on
      # demand. Wiring it into CI added noise without a gate, so it was removed.

      # Гейт строгой сборки доков (#1071). Тестовые job'ы ставят только [dev],
      # где нет mkdocs/mkdocstrings, поэтому build-тест в test_docs_api_reference.py
      # там пропускается — strict-сборка не была бы PR-гейтом, а ловилась бы лишь
      # post-merge в docs.yml. Ставим [docs] здесь и гоняем `mkdocs build --strict`
      # напрямую, чтобы битые ссылки / нерезолвленные autoref'ы валили PR заранее.
      - name: Docs build (strict)
        run: |
          pip install -e ".[docs]"
          mkdocs build --strict

      - name: Enforce pytest warnings as errors
        run: |
          python - <<'PY'
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as f:
              config = tomllib.load(f)

          actual = config["tool"]["pytest"]["ini_options"].get("filterwarnings")
          expected = ["error"]
          if actual != expected:
              print(f"Expected tool.pytest.ini_options.filterwarnings = {expected!r}, got {actual!r}")
              sys.exit(1)
          PY

  # The full test gate — runs on every PR and on main (#1051). Since the
  # sharding round it is three parallel jobs (smoke | shards | serial) whose
  # wall is the slowest shard, plus a push-only coverage-combine job (#1052).
  # NOTE (#1090): selective runs (pytest-testmon) were evaluated and dropped —
  # testmon only deselects in a single process (no-op under `-n auto`) and
  # testmon-collection + xdist + coverage INTERNALERRORs. The speedup is more
  # runners, not fewer tests; the full suite stays the gate.
  tests-smoke:
    runs-on: ubuntu-latest
    # Offline preflight over real critical paths (package import, CLI parser,
    # DB schema, web /health). Its own job so a fundamentally broken build reds
    # in ~1.5 min while the shards are still grinding. Live smoke
    # (real_provider_smoke / codex_*) stays opt-in and is skipped here — no
    # gate env vars are set.
    timeout-minutes: 10
    env:
      COVERAGE_FILE: .coverage.smoke
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Two legs like every test lane (#1456): the smoke lines must stay in the
      # push coverage dataset, else they drop out of the combined report and
      # the fail_under ratchet drifts (#1052). --cov-fail-under=0: a producer
      # holds only a slice of the suite, so the per-run fail_under from
      # pyproject would fail it; the ratchet is enforced where the FULL dataset
      # exists — coverage-combine below.
      - name: Pytest (smoke preflight)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: pytest tests -q -m smoke

      - name: Pytest (smoke preflight, with coverage)
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: pytest tests -q -m smoke --cov=src --cov-report= --cov-fail-under=0

      # include-hidden-files: the datasets are dotfiles (.coverage.*) and
      # upload-artifact v4+ silently excludes hidden files by default — the
      # first post-merge push run failed exactly there.
      - name: Upload coverage data
        if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-smoke
          path: .coverage.smoke
          if-no-files-found: error
          include-hidden-files: true

  # The parallel-safe suite, sharded ×3 across a runner matrix — the wall is
  # the slowest shard instead of the whole suite. Sharding is FILE-atomic so
  # the `--dist=loadfile` invariant survives (tests in one file stay on one
  # worker): scripts/shard_tests.py re-collects the same tree in every matrix
  # job and greedily balances whole files by test count, deterministically.
  # Deliberately NO positional `tests` arg: the file list IS the selection —
  # adding one would make every shard run the full-suite union instead of its
  # half.
  tests-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard-id: [0, 1, 2]
    env:
      # Names this job's coverage dataset so the three producers can upload
      # distinct files that coverage-combine merges; harmless on the PR leg
      # (no --cov flag there).
      COVERAGE_FILE: .coverage.shard${{ matrix.shard-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # On CI conftest.py uses every runner core (the load throttle is
      # dev-only), so `-n auto` fans out across all vCPUs. --durations surfaces
      # the slowest tests each run for ongoing tuning (#944). Coverage rides on
      # main only (#1456): instrumentation costs roughly a third of the suite's
      # wall time, and a PR only needs the pass/fail gate. --cov-fail-under=0:
      # a shard holds only a slice of src, so the pyproject fail_under (87)
      # must not be evaluated here — coverage-combine owns the ratchet. The
      # commands are deliberately duplicated rather than shell-built so
      # test_ci_workflow_structure.py can grep each leg.
      - name: Pytest (parallel-safe)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: pytest -q -m "not aiosqlite_serial" -n auto --durations=25 $(python scripts/shard_tests.py --num-shards 3 --shard-id ${{ matrix.shard-id }})

      - name: Pytest (parallel-safe, with coverage)
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: pytest -q -m "not aiosqlite_serial" -n auto --durations=25 --cov=src --cov-report= --cov-fail-under=0 $(python scripts/shard_tests.py --num-shards 3 --shard-id ${{ matrix.shard-id }})

      # pytest-cov merges the xdist worker datafiles into the single
      # COVERAGE_FILE at the end of the run ([tool.coverage.run] parallel =
      # true); reporting is deferred to coverage-combine.
      - name: Upload coverage data
        if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-shard${{ matrix.shard-id }}
          path: .coverage.shard${{ matrix.shard-id }}
          if-no-files-found: error
          include-hidden-files: true

  # aiosqlite_serial lane as its own job — hidden under the shards' wall, and
  # per-file parallelism (`--dist=loadfile`) preserved: independent files run
  # on separate workers while each file stays whole (the old single-process
  # command left all 986 tests serialized). The push leg starts a FRESH
  # dataset: --cov-append is gone because its coverage now reaches
  # coverage-combine as a separate artifact instead of appending into the same
  # job's file (#1052).
  tests-serial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COVERAGE_FILE: .coverage.serial
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Pytest (aiosqlite serial, per-file parallel)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: pytest tests -q -m aiosqlite_serial -n auto --dist=loadfile

      - name: Pytest (aiosqlite serial, per-file parallel, with coverage)
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: pytest tests -q -m aiosqlite_serial -n auto --dist=loadfile --cov=src --cov-report= --cov-fail-under=0

      - name: Upload coverage data
        if: ${{ !cancelled() && github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-serial
          path: .coverage.serial
          if-no-files-found: error
          include-hidden-files: true

  # Main (push) only: merge the per-job coverage datasets into the fail_under
  # report (#1052) and the xml diff artifact. `needs` plus `if-no-files-found:
  # error` on the producers guarantee the data files exist, so `coverage
  # combine` cannot hit the old "no data to combine" exit-1 gotcha. Deliberately
  # NOT gated on !cancelled(): if a producer fails, this skips with it — a
  # coverage report for a red run is worthless.
  coverage-combine:
    if: ${{ github.event_name == 'push' }}
    needs: [tests-smoke, tests-shards, tests-serial]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Download coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true
          path: .

      - name: Coverage report (combined)
        run: |
          coverage combine
          coverage report
          coverage xml -o coverage.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
